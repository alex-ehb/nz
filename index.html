<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una pregunta especial...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Capa para iniciar el audio (exigencia de los navegadores móviles) */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }

        #start-button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: black;
            background-color: #ff4d6d;
            border: none;
            border-radius: 25px;
            box-shadow: 0 0 15px #ff4d6d;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Contenido interactivo final */
        #content {
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        #sticker {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial para permitir reproducción de audio en móviles -->
    <div id="start-overlay" onclick="iniciarExperiencia()">
        <button id="start-button">Toca para abrir 💖</button>
    </div>

    <!-- Música de fondo -->
    <audio id="bg-music" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div id="canvas-container">
        <canvas id="mainCanvas" width="800" height="450"></canvas>
    </div>

    <div id="content">
        <h1>¿Puedo ser tu novio?</h1>
        <img id="sticker" src="sticker.png" alt="Sticker">
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const music = document.getElementById('bg-music');

        function iniciarExperiencia() {
            document.getElementById('start-overlay').style.display = 'none';
            music.play().catch(e => console.log("Error al reproducir audio:", e));
            iniciarAnimacion();
        }

        // --- ECUACIÓN DEL CORAZÓN ---
        function corazon(n) {
            const x = 16 * Math.pow(Math.sin(n), 3);
            const y = 13 * Math.cos(n) - 5 * Math.cos(2 * n) - 2 * Math.cos(3 * n) - Math.cos(4 * n);
            return { x, y };
        }

        // --- DIBUJAR CAPA DEL CORAZÓN ---
        let capaCorazon = 1;
        function animarCorazon() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 20;

            if (capaCorazon <= 15) {
                ctx.strokeStyle = '#FF0033';
                ctx.lineWidth = 1.5;
                ctx.beginPath();

                for (let n = 0; n < Math.PI * 2; n += 0.05) {
                    const pt = corazon(n);
                    const drawX = centerX + pt.x * capaCorazon;
                    const drawY = centerY - pt.y * capaCorazon; // Invertir Y para canvas HTML
                    if (n === 0) ctx.moveTo(drawX, drawY);
                    else ctx.lineTo(drawX, drawY);
                }
                ctx.closePath();
                ctx.stroke();

                capaCorazon++;
                setTimeout(animarCorazon, 800);
            } else {
                setTimeout(animarGirasoles, 600);
            }
        }

        // --- DIBUJAR GIRASOLES ---
        function dibujarGirasol(x, y) {
            // Tallo
            ctx.strokeStyle = "#1E5631";
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + 200);
            ctx.stroke();

            // Hojas
            dibujarHoja(x, y + 80, true);
            dibujarHoja(x, y + 80, false);
            dibujarHoja(x, y + 120, true);
            dibujarHoja(x, y + 120, false);

            const numPetalos = 18;

            // Capa trasera de pétalos (Naranja/Dorado)
            ctx.fillStyle = "#FF8C00";
            for (let i = 0; i < numPetalos; i++) {
                const angulo = (i * 2 * Math.PI / numPetalos) + 0.1;
                dibujarPetalo(x, y, angulo, 55, 20);
            }

            // Capa delantera de pétalos (Amarillo)
            ctx.fillStyle = "#FFD700";
            for (let i = 0; i < numPetalos; i++) {
                const angulo = (i * 2 * Math.PI / numPetalos);
                dibujarPetalo(x, y, angulo, 50, 18);
            }

            // Centro Marrón Centrado
            ctx.fillStyle = "#3D2314";
            ctx.beginPath();
            ctx.arc(x, y, 32, 0, Math.PI * 2);
            ctx.fill();

            // Textura centro
            ctx.strokeStyle = "#654321";
            ctx.lineWidth = 1;
            for (let r = 8; r < 30; r += 5) {
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function dibujarPetalo(cx, cy, angulo, largo, ancho) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angulo);
            ctx.beginPath();
            ctx.ellipse(largo / 2, 0, largo / 2, ancho / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function dibujarHoja(x, y, esIzquierda) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(esIzquierda ? -1 : 1, 1);
            ctx.fillStyle = "#2E8B57";
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(30, -20, 50, 0);
            ctx.quadraticCurveTo(30, 20, 0, 0);
            ctx.fill();
            ctx.restore();
        }

        function animarGirasoles() {
            dibujarGirasol(130, 180);
            dibujarGirasol(670, 180);

            // Mostrar el texto y el sticker
            document.getElementById('content').style.opacity = '1';
        }

        function iniciarAnimacion() {
            animarCorazon();
        }
    </script>
</body>
</html>
